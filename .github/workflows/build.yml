# Builds a debug APK on every push and attaches it to the run.
#
# There is no Gradle wrapper in this repository, so Gradle is installed by the setup action and
# invoked directly. That keeps a binary jar out of the repo at the cost of pinning the version here.
name: Build APK

on:
  push:
    branches: [ main, 'test/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee gradle-build.log

      - name: Record build failure
        if: failure()
        run: |
          echo "--- error index ---"
          grep -in "e: \|error:\|FAILURE\|Caused by\|Execution failed" gradle-build.log | tail -n 60 || true
          echo "--- log tail ---"
          tail -n 80 gradle-build.log

      # Published as a release rather than left as a run artifact. Artifacts need a GitHub login
      # and arrive as a zip, which is awkward on the phone the app is meant to be installed on.
      #
      # Uses a personal token rather than the built-in one, and is skipped entirely when that token
      # is missing. The built-in token would work with `permissions: contents: write`, but it would
      # author every release as github-actions[bot], and a release author cannot be changed after
      # the fact.
      - name: Publish the APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PAT is not set; the APK is attached to this run instead."
            exit 0
          fi
          # Named after the app version rather than the commit. A release page is something a
          # person reads before installing, and a hex string tells them nothing.
          VERSION="$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
          SRC="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          cp "$SRC" "ManualRotate-$VERSION.apk"
          gh release delete "v$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION" \
            --title "ManualRotate $VERSION" \
            --notes "Switch the screen between portrait and landscape from the quick settings panel, without turning your phone." \
            "ManualRotate-$VERSION.apk"
          echo "Published v$VERSION"

      - name: Attach the APK to the run
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ManualRotate-debug
          path: app/build/outputs/apk/debug/*.apk
